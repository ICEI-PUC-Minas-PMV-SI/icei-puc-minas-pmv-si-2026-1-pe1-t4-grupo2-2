<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Pedido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="../../assets/img/logo-1_1.png" alt="CareConnect Logo" class="logo-img">
            </div>
            <nav class="nav-menu">
                <a href="../tela_pedidos/pedidos.html" class="nav-link">Pedidos</a>
                <a href="#" class="nav-link nav-link--active">Criar Pedido</a>
                <a href="../transacoes/transações.html" class="nav-link">Transações</a>
                <a href="../tela_perfil/tela_perfil.html" class="nav-link">Meu Perfil</a>
                <a href="../tela_login/tela_login.html" class="nav-link">Sair</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <section class="section-page">
            <h2>Criar Pedido</h2>
            <label for="title">Título</label>
            <input type="text" placeholder="Digite o título do pedido" id="title" required>
            <label for="category">Categoria</label>
            <select id="category" required>
                <option value="" disabled selected>Selecione a categoria</option>
                <option value="categoria1">Roupas</option>
                <option value="categoria2">Alimentos</option>
                <option value="categoria3">Eletrônicos</option>
                <option value="categoria4">Móveis</option>
                <option value="categoria5">Brinquedos</option>
                <option value="categoria6">Livros</option>
                <option value="categoria7">Esportes</option>
                <option value="categoria8">Beleza</option>
                <option value="categoria9">Saúde</option>
            </select>
            <label for="description">Descrição</label>
            <textarea
                placeholder="Digite a descrição do pedido"
                id="description"
                required
            ></textarea>
            <button type="submit">Gerar Pedido</button>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-container">
            <span class="footer-text">
                © 2026 CareConnect. Todos os direitos reservados.<br>
                Desenvolvido por Grupo 2 - PUC Minas
            </span>
            <div class="logo">
                <img src="../../assets/img/logo-1_0.png" alt="CareConnect Logo" class="logo-img-footer">
            </div>
        </div>
    </footer>
</body>
</html>
