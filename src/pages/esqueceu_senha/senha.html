<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="../assets/img/logo-1_1.png" alt="CareConnect Logo" class="logo-img">
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link">Pedidos</a>
                <a href="#" class="nav-link">Sobre</a>
                <a href="../lista_pedidos/lista_pedidos.html" class="nav-link">Sair</a></a>Login</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <section class="section-page">
            <h2>Recuperação de Senha</h2>
            <p class="descricao">Digite seu e-mail cadastrado para receber o link de recuperação</p>
            <form action="#" method="post">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="user@gmail.com" required>
                <button type="submit">ENVIAR LINK</button>
            </form>
            <div class="mensagem-ajuda">
                Após enviar, verifique sua caixa de entrada e spam
            </div>
            <div class="voltar">
                <a href="../login.html">Voltar para a tela de login</a>
            </div>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-container">
            <span class="footer-text">
                © 2024 CareConnect. Todos os direitos reservados.
            </span>
            <div class="logo">
                <img src="../assets/img/logo-1_0.png" alt="CareConnect Logo" class="logo-img-footer">
            </div>
        </div>
    </footer>
</body>
</html>
