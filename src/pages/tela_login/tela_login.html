<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="../assets/img/logo-1_1.png" alt="CareConnect Logo" class="logo-img">
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-link">Pedidos</a>
                <a href="#" class="nav-link">Sobre</a>
                <a href="tela_login.html" class="nav-link">Login</a>
            </nav>
        </div>
    </header>
    <div class="container">
        <section class="section-page">
            <h2>Tela de Login</h2>
            <label for="user">Usuário ou E-mail</label>
            <input type="text" placeholder="Digite seu Usuário ou E-mail" id="user" required>
            <div class="links-container">
                <div class="recupera-senha">
                    <a href="../esqueceu_senha/senha.html">Esqueceu a Senha?</a>
                </div>
                <div class="cria-conta">
                    <a href="../criar_conta/criar-conta.html">Criar Conta</a>
                </div>
            </div>
            <button type="submit">ENTRAR</button>
        </section>
    </div>
    <footer class="footer">
        <div class="footer-container">
            <span class="footer-text">
                © 2024 CareConnect. Todos os direitos reservados.
            </span>
            <div class="logo">
                <img src="../assets/img/logo-1_0.png" alt="CareConnect Logo" class="logo-img-footer">
            </div>
        </div>
    </footer>
</body>
</html>
