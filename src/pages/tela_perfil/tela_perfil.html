<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img
            src="../assets/img/logo-1_1.png"
            alt="CareConnect Logo"
            class="logo-img"
          />
        </div>
        <nav class="nav-menu">
          <a href="../criar_pedido/criar_pedido.html" class="nav-link">Pedidos</a>
          <a href="../tela_sobre/tela_sobre.html" class="nav-link">Sobre</a>
          <a href="../tela_login/tela_login.html" class="nav-link">Login</a>
        </nav>
      </div>
    </header>

    <main class="conteudo">
      <details class="dropdown-perfil" >
        <summary>Perfil</summary>
        <div class="dropdown-content">
          <div class="perfil-container">
            <div class="perfil-esquerdo">
              <div class="perfil-pic">
                <img src="perfil-pic.jpg" alt="Foto de Perfil" />
              </div>
            </div>
            <div class="perfil-direito">
              <div class="coluna">
                <div class="input-box w45">
                  <label>Nome</label>
                  <input />
                </div>
                <div class="input-box w45">
                  <label>Data</label>
                  <input type="date" />
                </div>
              </div>
              <div class="coluna">
                <div class="input-box w45">
                  <label>Email</label>
                  <input />
                </div>
              </div>
              <div class="coluna">
                <div class="input-box w25">
                  <label>Telefone</label>
                  <input />
                </div>
                <div class="input-box w25">
                  <label>CPF/CNPJ</label>
                  <input />
                </div>
                <div class="input-box w25">
                  <label>CEP</label>
                  <input />
                </div>
              </div>
              <div class="coluna">
                <div class="input-box w45">
                  <label>Rua</label>
                  <input />
                </div>
                <div class="input-box w10">
                  <label>Número</label>
                  <input />
                </div>
                <div class="input-box w10">
                  <label>Apto</label>
                  <input />
                </div>
              </div>
            </div>
            <div class="perfil-baixo">
              <div class="input-box full">
                <label>motivações</label>
                <textarea></textarea>
              </div>
              <div class="input-box full">
                <label>Objetivos</label>
                <textarea></textarea>
              </div>
              <div class="input-box full">
                <label>Bio</label>
                <textarea></textarea>
              </div>
            </div>
          </div>
        </div>
      </details>
    </main>

    <footer class="footer">
      <div class="footer-container">
        <span class="footer-text">
          © 2024 CareConnect. Todos os direitos reservados.
        </span>
        <div class="logo">
          <img
            src="../assets/img/logo-1_0.png"
            alt="CareConnect Logo"
            class="logo-img-footer"
          />
        </div>
      </div>
    </footer>
  </body>
</html>
