<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img
            src="../../assets/img/logo-1_1.png"
            alt="CareConnect Logo"
            class="logo-img"/>
        </div>
        <nav class="nav-menu">
          <a href="../sobre_nos/sobre-nos.html" class="nav-link">Sobre</a>
          <a href="../criar_pedido/criar_pedido.html" class="nav-link"
            >Pedidos</a>
          <a href="../transacoes/transações.html" class="nav-link">Transações</a>
        </nav>
      </div>
    </header>

    <div class="box">
      <!-- Abas -->
      <div class="abas">
        <input type="radio" name="aba" id="perfil" checked />
        <label for="perfil" class="aba prf">Perfil</label>

        <input type="radio" name="aba" id="pedidos" />
        <label for="pedidos" class="aba pdd">Pedidos</label>
      </div>
      <div class="content">
        <!-- Perfil do Usuário -->
        <div class="area perfil-area">
          <div class="perfil-box">
            <!-- Lado esquerdo do Perfil -->
            <div class="perfil-left">
              <div class="imagem-perfil">
                <img src="3x4.jpg" alt="Perfil" />
              </div>
            </div>

            <!-- Lado direito do Perfil -->
            <div class="perfil-right">
              <div class="form-grid">
                <div class="input-group w45">
                  <label>Nome</label>
                  <input type="text" />
                </div>
                <div class="input-group w45">
                  <label>Data</label>
                  <input type="date" />
                </div>
                <div class="input-group w45">
                  <label>Email</label>
                  <input type="email" />
                </div>
                <div class="input-group w25">
                  <label>Telefone</label>
                  <input type="text" />
                </div>
                <div class="input-group w25">
                  <label>CNPJ/CPF</label>
                  <input type="text" />
                </div>
                <div class="input-group w25">
                  <label>Estado</label>
                  <input type="text" />
                </div>
                <div class="input-group w25">
                  <label>Cidade</label>
                  <input type="text" />
                </div>
                <div class="input-group w25">
                  <label>CEP</label>
                  <input type="text" />
                </div>
                <div class="input-group w45">
                  <label>Rua</label>
                  <input type="text" />
                </div>
                <div class="input-group w10">
                  <label>Número</label>
                  <input type="text" />
                </div>
                <div class="input-group w10">
                  <label>Apto</label>
                  <input type="text" />
                </div>
              </div>
            </div>
          </div>
          <!-- Parte inferior do Perfil -->
          <div class="textareas">
            <div class="input-group full">
              <label>Motivações</label>
              <textarea></textarea>
            </div>
            <div class="input-group full">
              <label>Objetivos</label>
              <textarea></textarea>
            </div>
            <div class="input-group full">
              <label>Bio</label>
              <textarea></textarea>
            </div>
          </div>
        </div>

        <!-- Histórico de Pedidos -->
        <div class="area pedidos-area">
          <div class="filtro-pedidos">
            <div class="input-group data-group">
              <label>De:</label>
              <input type="date" />
            </div>
            <div class="input-group data-group">
              <label>Até:</label>
              <input type="date" />
            </div>
            <button class="btn-buscar">Buscar Pedidos</button>
          </div>

          <div class="pedidos-lista">
            <div class="pedido andamento">Em Andamento</div><div class="pedido andamento">Em Andamento</div><div class="pedido andamento">Em Andamento</div><div class="pedido andamento">Em Andamento</div>
            <div class="pedido entregue">Pedido Entregue</div>
            <div class="pedido cancelado">Pedido Cancelado</div>
            <div class="pedido entregue">Pedido Entregue</div>
            <div class="pedido cancelado">Pedido Cancelado</div>
            <div class="pedido entregue">Pedido Entregue</div>
            <div class="pedido cancelado">Pedido Cancelado</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
      <div class="footer-container">
        <span class="footer-text">
          © 2026 CareConnect. Todos os direitos reservados.
        </span>
        <div class="logo">
          <img
            src="../../assets/img/logo-1_0.png"
            alt="CareConnect Logo"
            class="logo-img-footer"
          />
        </div>
      </div>
    </footer>
  </body>
</html>
